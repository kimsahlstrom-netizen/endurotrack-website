<!doctype html>
<html lang="sv">
<head>

<meta property="og:description" content="Öppet idag? Se status, öppettider, priser och kommande händelser – direkt från klubben.">

<link rel="stylesheet" href="../assets/style.css?v=20261013b">
<style>
  /* Hero */
  .hero-track { background: var(--ink); color: #fff; padding: 34px 0 30px; position: relative; overflow: hidden; }
  .hero-track::after { content: ""; position: absolute; right: -80px; top: -60px; width: 340px; height: 340px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,210,0,.16), rgba(255,210,0,0) 70%); pointer-events: none; }
  .hero-track .wrap { max-width: 980px; position: relative; z-index: 1; }
  .hero-track h1 { font-size: clamp(34px, 7vw, 60px); margin: 12px 0 6px; overflow-wrap: anywhere; }
  .hero-track .club { color: var(--muted-on-ink); font-weight: 700; font-size: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .chip { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,.1); color: #fff; }
  .status { display: inline-flex; gap: 12px; align-items: flex-start; border-radius: 14px; padding: 12px 16px; margin-top: 20px; font-weight: 800; }
  .status.open { background: #1f8a46; color: #fff; }
  .status.closed { background: #b42318; color: #fff; }
  .status.unknown { background: rgba(255,255,255,.1); color: #fff; font-weight: 700; }
  .status .dot { width: 12px; height: 12px; border-radius: 50%; background: currentColor; margin-top: 6px; flex: none; }
  .status.open .dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .status small { display: block; font-weight: 600; opacity: .9; margin-top: 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .actions .btn { font-size: 15px; }
  button.btn { cursor: pointer; font-family: inherit; }
  button.btn-ghost { background: transparent; }

  /* Body */
  .track { max-width: 980px; margin: 0 auto; padding: 26px 16px 56px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 22px; }
  @media (min-width: 860px) { .grid { grid-template-columns: 1.35fr 1fr; align-items: start; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .card + .card { margin-top: 22px; }
  .card h2 { font-size: 15px; letter-spacing: .08em; margin: 0 0 14px; color: var(--gold-text); }
  .card h3 { font-size: 13px; margin: 14px 0 6px; }
  .empty { color: var(--muted); margin: 0; }

  .map { position: relative; height: 300px; border-radius: var(--radius); overflow: hidden; background: #dfe5d8;
    background-image: linear-gradient(rgba(10,24,71,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(10,24,71,.06) 1px, transparent 1px);
    background-size: 28px 28px; border: 1px solid var(--line); margin-bottom: 22px; }
  .map-cover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px; }
  .map-cover .pin { width: 34px; height: 34px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--gold); border: 4px solid var(--ink); }
  .map-cover small { color: var(--muted); max-width: 360px; }
  .map-cover .btn { background: var(--ink); color: #fff; }
  #leaflet { position: absolute; inset: 0; }

  .event { display: flex; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
  .event:first-of-type { border-top: 0; padding-top: 0; }
  .date { flex: none; width: 58px; text-align: center; border-radius: 12px; background: var(--ink); color: #fff; padding: 8px 0 6px; }
  .date .d { font-size: 24px; line-height: 1; }
  .date .m { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); margin-top: 3px; }
  .event .kind { font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .event .title { font-weight: 800; }
  .event p, .msg p { margin: 4px 0 0; white-space: pre-line; }
  .msg { padding: 12px 0; border-top: 1px solid var(--line); }
  .msg:first-of-type { border-top: 0; padding-top: 0; }
  .msg .when { font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }

  .info dt { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 14px; }
  .info dt:first-child { margin-top: 0; }
  .info dd { margin: 3px 0 0; white-space: pre-line; overflow-wrap: anywhere; }

  .follow { border-radius: 18px; padding: 24px; margin-top: 26px; background: var(--ink); color: #fff; display: grid; gap: 16px; }
  @media (min-width: 720px) { .follow { grid-template-columns: 1fr auto; align-items: center; } }
  .follow h2 { font-size: 26px; margin: 0; }
  .follow p { margin: 6px 0 0; color: var(--muted-on-ink); }
  .follow .muted-small { font-size: 13px; }
  .club-tools { text-align: center; margin-top: 18px; font-size: 14px; color: var(--muted); }
  .club-tools button { background: none; border: 0; color: var(--gold-text); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; }
  .vip { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; background: var(--gold); color: var(--ink); border-radius: 6px;
    padding: 4px 12px; transform: skewX(-10deg); font-size: 13px; vertical-align: top; }
  .followers { color: var(--muted-on-ink); font-size: 14px; font-weight: 700; margin-top: 6px; }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 22px; }
  .photos img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; background: var(--line); }
  .photos img:first-child { grid-column: 1 / -1; aspect-ratio: 16 / 9; }
  .lb { list-style: none; margin: 0; padding: 0; }
  .lb li { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
  .lb li:first-child { border-top: 0; padding-top: 0; }
  .lb .pos { width: 28px; font-size: 20px; text-align: center; }
  .lb li:first-child .pos { color: var(--gold-text); }
  .lb .who { flex: 1; font-weight: 800; }
  .lb .who small { display: block; font-weight: 600; color: var(--muted); font-size: 12px; }
  .lb .t { font-size: 20px; font-variant-numeric: tabular-nums; }
  .cal { background: none; border: 0; padding: 0; margin-top: 6px; color: var(--gold-text); font: inherit; font-size: 13px; font-weight: 700; text-decoration: underline; cursor: pointer; }
  .cal-all { margin-top: 12px; }
  .loading { max-width: 980px; margin: 0 auto; padding: 40px 16px; color: var(--muted); }

  /* Printable A4 poster for the club (QR code at the gate). Shown on screen
     with ?affisch=1, and used when the club presses "Skriv ut". */
  #poster { display: none; }
  .pz { width: 210mm; height: 297mm; margin: 0 auto; background: var(--ink); color: #fff; position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; text-align: center; padding: 16mm 16mm 12mm;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .pz::before { content: ""; position: absolute; left: -40mm; right: -40mm; top: 118mm; height: 46mm; background: var(--gold);
    transform: skewY(-8deg); opacity: .95; }
  .pz > * { position: relative; z-index: 1; }
  .pz-brand { display: flex; align-items: center; gap: 4mm; }
  .pz-brand img { width: 16mm; height: 16mm; }
  .pz-brand span { font-size: 15mm; }
  .pz-badges { display: flex; gap: 3mm; margin-top: 8mm; }
  .pz-badge { background: #fff; color: var(--ink); border-radius: 2mm; padding: 1.4mm 4mm; transform: skewX(-10deg); font-size: 4.2mm; }
  .pz-badge.vip { background: var(--gold); }
  .pz-q { font-size: 9mm; color: var(--gold); margin-top: 9mm; }
  .pz h1 { font-size: 17mm; line-height: .92; margin: 3mm 0 0; overflow-wrap: anywhere; }
  .pz-club { font-size: 7mm; font-weight: 800; color: var(--muted-on-ink); margin-top: 3mm; }
  .pz-qrcard { background: #fff; border-radius: 6mm; padding: 6mm 6mm 4mm; margin-top: 9mm; border: 2.5mm solid var(--ink);
    box-shadow: 0 0 0 1.6mm var(--gold); }
  .pz-qrcard .qr img, .pz-qrcard .qr canvas { width: 72mm !important; height: 72mm !important; display: block; }
  .pz-scan { color: var(--ink); font-size: 5mm; margin-top: 3mm; }
  .pz-feats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4mm; list-style: none; padding: 0; margin: 10mm 0 0; width: 100%; }
  .pz-feats li { background: rgba(255,255,255,.08); border-radius: 4mm; padding: 4mm 3mm; font-size: 4.3mm; font-weight: 700; line-height: 1.3; }
  .pz-feats b { display: block; font-size: 8mm; margin-bottom: 1.5mm; }
  .pz-foot { margin-top: auto; font-size: 4.6mm; color: var(--muted-on-ink); }
  .pz-foot strong { color: #fff; }
  body.poster-mode > *:not(#poster) { display: none !important; }
  body.poster-mode { background: #888; }
  body.poster-mode #poster { display: block; padding: 10mm 0; }
  @media print {
    body > *:not(#poster) { display: none !important; }
    body, body.poster-mode { background: none; }
    #poster, body.poster-mode #poster { display: block !important; padding: 0; }
    @page { size: A4; margin: 0; }
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="../" aria-label="Maxvarv">
      <img src="../assets/mark.png" alt="" width="44" height="44">

<script>
// Public track page: only what the club publishes (Supabase function
// public_spot). Same project and publishable client key as the app.
// The map and the QR code load from outside services only when the visitor
// asks for them (no third-party requests on page load).
(function () {
  var SUPABASE = "https://xhxugrpbypzushqkknnd.supabase.co";
  var KEY = "sb_publishable_RBqx84SpN7z1IBwbItBtDA_05goMtyP";
  var APP_STORE = "https://apps.apple.com/se/app/maxvarv/id6820570956";
  var page = document.getElementById("page");
  var id = new URLSearchParams(location.search).get("id") || "";
  var KINDS = { training: "Träning", competition: "Tävling", work_day: "Jobbardag", other: "Händelse" };
  var VEHICLES = { enduro: "Enduro", motocross: "Motocross", snowmobile: "Skoter", atv: "ATV" };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function ago(iso) {
    var min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (min < 60) return "för " + Math.max(min, 1) + " min sedan";
    var h = Math.round(min / 60);
    if (h < 24) return "för " + h + " tim sedan";
    return new Date(iso).toLocaleDateString("sv-SE", { day: "numeric", month: "short" });
  }
  function isToday(iso) {
    return new Date(iso).toDateString() === new Date().toDateString();
  }
  function time(iso) {
    return new Date(iso).toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit" });
  }
  function lap(sec) {
    var m = Math.floor(sec / 60), r = sec - m * 60;
    return m + ":" + (r < 10 ? "0" : "") + r.toFixed(1);
  }
  function icsDate(iso) {
    return new Date(iso).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  }
  function icsText(t) {
    return String(t || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
  }
  // Calendar file (.ics) that every phone and computer calendar can open.
  function downloadIcs(spot, events, filename) {
    var lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Maxvarv//Bana//SV", "CALSCALE:GREGORIAN"];
    events.forEach(function (e, i) {
      var end = e.ends_at || new Date(new Date(e.starts_at).getTime() + 2 * 3600000).toISOString();
      lines.push("BEGIN:VEVENT",
        "UID:" + spot.id + "-" + icsDate(e.starts_at) + "-" + i + "@maxvarv.se",
        "DTSTAMP:" + icsDate(new Date().toISOString()),
        "DTSTART:" + icsDate(e.starts_at),
        "DTEND:" + icsDate(end),
        "SUMMARY:" + icsText((KINDS[e.kind] || "Händelse") + ": " + e.title + " – " + spot.name),
        "LOCATION:" + icsText(spot.name + (spot.club ? ", " + spot.club : "")),
        "GEO:" + spot.latitude + ";" + spot.longitude,
        "DESCRIPTION:" + icsText((e.details ? e.details + "\n\n" : "") + location.href),
        "URL:" + location.href,
        "END:VEVENT");
    });
    lines.push("END:VCALENDAR");
    var blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }
  function fail(text) {
    page.textContent = "";
    var m = el("main", "track");
    m.appendChild(el("h1", "display", "Banan hittades inte"));
    m.appendChild(el("p", "empty", text));
    page.appendChild(m);
  }
  function button(text, href, cls) {
    var a = el("a", "btn " + (cls || "btn-ghost"), text);
    a.href = href;
    if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; }
    return a;
  }
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  function loadCss(href) {
    var l = document.createElement("link");
    l.rel = "stylesheet"; l.href = href;
    document.head.appendChild(l);
  }

  // A4 poster: Maxvarv look with the track's and the club's name.
  function buildPoster(s) {
    var p = document.getElementById("poster");
    p.textContent = "";
    var pz = el("div", "pz");
    var brand = el("div", "pz-brand");
    var logo = el("img"); logo.src = "../assets/mark.png"; logo.alt = "";
    brand.appendChild(logo);
    var word = el("span", "display", "Max");
    word.appendChild(el("span", "gold", "varv"));
    brand.appendChild(word);
    pz.appendChild(brand);
    var badges = el("div", "pz-badges");
    badges.appendChild(el("span", "pz-badge display", s.official ? "Officiell bana" : "Ställe att köra"));
    if (s.club_verified) badges.appendChild(el("span", "pz-badge vip display", "✓ Klubben på Maxvarv"));
    pz.appendChild(badges);
    pz.appendChild(el("div", "pz-q display", "Öppet idag?"));
    var title = el("h1", "display", s.name);
    // Long one-word names get a smaller size so they fit across the page.
    var longest = Math.max.apply(null, s.name.split(/\s+/).map(function (w) { return w.length; }));
    title.style.fontSize = Math.min(17, 168 / Math.max(longest, 1)) + "mm";
    pz.appendChild(title);
    if (s.club) pz.appendChild(el("div", "pz-club", s.club));
    var card = el("div", "pz-qrcard");
    var qr = el("div", "qr");
    card.appendChild(qr);
    card.appendChild(el("div", "pz-scan display", "Skanna med kameran"));
    pz.appendChild(card);
    new QRCode(qr, { text: "https://maxvarv.se/bana/?id=" + s.id, width: 600, height: 600, colorDark: "#0a1847", correctLevel: QRCode.CorrectLevel.M });
    var feats = el("ul", "pz-feats");
    [["🟢", "Öppet eller stängt – direkt från klubben"], ["📅", "Träningar, tävlingar och jobbardagar"], ["⏱️", "Dina varvtider på banan"]].forEach(function (f) {
      var li = el("li"); li.appendChild(el("b", null, f[0])); li.appendChild(document.createTextNode(f[1])); feats.appendChild(li);
    });
    pz.appendChild(feats);
    var foot = el("div", "pz-foot");
    foot.appendChild(document.createTextNode("Följ banan gratis i appen "));
    foot.appendChild(el("strong", null, "Maxvarv"));
    foot.appendChild(document.createTextNode(" · maxvarv.se"));
    pz.appendChild(foot);
    p.appendChild(pz);
  }

  if (!/^[0-9a-f-]{36}$/i.test(id)) { fail("Länken saknar bana. Öppna banan i Maxvarv och tryck Dela."); return; }

  fetch(SUPABASE + "/rest/v1/rpc/public_spot", {
    method: "POST",
    headers: { "apikey": KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ p_spot: id })
  }).then(function (r) { return r.json(); }).then(function (s) {
    if (!s || !s.name) { fail("Banan finns inte längre, eller så är länken fel."); return; }
    document.title = s.name + " – Maxvarv";
    page.textContent = "";

    // ---- Hero ------------------------------------------------------------
    var hero = el("section", "hero-track");
    var hw = el("div", "wrap");
    var badges = el("div");
    badges.appendChild(el("span", "badge display", s.official ? "Officiell bana" : "Ställe att köra"));
    if (s.club_verified) {
      var vip = el("span", "vip display", "✓ Klubben på Maxvarv");
      vip.title = "Klubben uppdaterar själv banan i Maxvarv – status, öppettider och kalender kommer direkt från klubben.";
      badges.appendChild(vip);
    }
    hw.appendChild(badges);
    hw.appendChild(el("h1", "display", s.name));
    if (s.club) hw.appendChild(el("div", "club", s.club));
    if (s.followers > 0) hw.appendChild(el("div", "followers", s.followers + (s.followers === 1 ? " förare följer banan" : " förare följer banan")));

    var vehicles = (s.vehicles || []).map(function (v) { return VEHICLES[v]; }).filter(Boolean);
    if (vehicles.length) {
      var chips = el("div", "chips");
      vehicles.forEach(function (v) { chips.appendChild(el("span", "chip", v)); });
      hw.appendChild(chips);
    }

    var known = s.status === "open" || s.status === "closed";
    var st = el("div", "status " + (known ? s.status : "unknown"));
    st.appendChild(el("span", "dot"));
    var stText = el("div", null, known ? (s.status === "open" ? "ÖPPET IDAG" : "STÄNGT") : "Klubben har inte satt dagens status");
    if (known && s.status_note) stText.appendChild(el("small", null, s.status_note));
    if (known && s.status_updated_at) stText.appendChild(el("small", null, "Uppdaterat " + ago(s.status_updated_at)));
    if (!known) stText.appendChild(el("small", null, "Se öppettiderna nedan eller kontakta klubben."));
    st.appendChild(stText);
    hw.appendChild(st);

    var actions = el("div", "actions");
    actions.appendChild(button("Vägbeskrivning", "https://www.google.com/maps/dir/?api=1&destination=" + s.latitude + "," + s.longitude, "btn-gold"));
    if (s.website && /^https?:\/\//i.test(s.website)) actions.appendChild(button("Klubbens hemsida", s.website));
    if (s.phone) actions.appendChild(button("Ring", "tel:" + s.phone.replace(/[^0-9+]/g, "")));
    var share = el("button", "btn btn-ghost", "Dela");
    share.type = "button";
    share.addEventListener("click", function () {
      var data = { title: s.name + " – Maxvarv", text: "Status och öppettider för " + s.name, url: location.href };
      if (navigator.share) { navigator.share(data).catch(function () {}); return; }
      navigator.clipboard.writeText(location.href).then(function () { share.textContent = "Länken kopierad ✓"; });
    });
    actions.appendChild(share);
    hw.appendChild(actions);
    hero.appendChild(hw);
    page.appendChild(hero);

    // ---- Body ------------------------------------------------------------
    var main = el("main", "track");

    // Track photos published by the club (or Maxvarv).
    if ((s.photos || []).length) {
      var gallery = el("div", "photos");
      main.appendChild(gallery);
      s.photos.forEach(function (path) {
        fetch(SUPABASE + "/storage/v1/object/authenticated/photos/" + path.split("/").map(encodeURIComponent).join("/"), { headers: { "apikey": KEY } })
          .then(function (r) { if (!r.ok) throw r; return r.blob(); })
          .then(function (b) { var img = el("img"); img.alt = s.name; img.src = URL.createObjectURL(b); gallery.appendChild(img); })
          .catch(function () {});
      });
    }

    // Timed courses (motocross track, enduro loop …), each with its own
    // start/finish line and season top 5. Older data: the single line.
    var courses = (s.courses || []).length ? s.courses
      : (s.gate_lat != null ? [{ name: null, gate_lat: s.gate_lat, gate_lon: s.gate_lon, leaderboard: s.leaderboard || [] }] : []);

    // Map: loads OpenStreetMap only on request.
    var map = el("div", "map");
    var cover = el("div", "map-cover");
    cover.appendChild(el("span", "pin"));
    cover.appendChild(el("strong", null, s.latitude.toFixed(5) + ", " + s.longitude.toFixed(5)));
    var showMap = el("button", "btn", "Visa karta");
    showMap.type = "button";
    cover.appendChild(showMap);
    cover.appendChild(el("small", null, (courses.length ? (courses.length > 1 ? "Med start/mål-linjerna för varvtider. " : "Med start/mål-linjen för varvtider. ") : "") + "Kartan hämtas från OpenStreetMap när du trycker."));
    map.appendChild(cover);
    showMap.addEventListener("click", function () {
      showMap.textContent = "Laddar karta…";
      loadCss("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css");
      loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js").then(function () {
        map.removeChild(cover);
        var box = el("div"); box.id = "leaflet"; map.appendChild(box);
        var lmap = L.map(box, { scrollWheelZoom: false }).setView([s.latitude, s.longitude], 15);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19, attribution: "© OpenStreetMap"
        }).addTo(lmap);
        L.circleMarker([s.latitude, s.longitude], { radius: 11, color: "#0a1847", weight: 4, fillColor: "#ffd200", fillOpacity: 1 })
          .addTo(lmap).bindPopup(s.name);
        if (courses.length) {
          var pts = [[s.latitude, s.longitude]];
          courses.forEach(function (c) {
            // Start/finish: laps count within 20 m of this point.
            L.circle([c.gate_lat, c.gate_lon], { radius: 20, color: "#0a1847", weight: 3, dashArray: "6 5", fillColor: "#ffffff", fillOpacity: 0.5 }).addTo(lmap);
            var popup = el("div");
            if (c.name) popup.appendChild(el("strong", null, c.name + " "));
            popup.appendChild(document.createTextNode("Start/mål – varvtiderna mäts här"));
            L.marker([c.gate_lat, c.gate_lon], { icon: L.divIcon({ className: "", html: '<div style="font-size:26px;line-height:1;transform:translate(-4px,-22px)">🏁</div>' }) })
              .addTo(lmap).bindPopup(popup);
            pts.push([c.gate_lat, c.gate_lon]);
          });
          lmap.fitBounds(L.latLngBounds(pts).pad(0.6), { maxZoom: 17 });
        }
      }).catch(function () { showMap.textContent = "Kunde inte ladda kartan"; });
    });
    main.appendChild(map);

    var grid = el("div", "grid");
    var left = el("div"), right = el("div");

    // Upcoming events
    var ev = el("section", "card");
    ev.appendChild(el("h2", "display", "Kommande"));
    if ((s.events || []).length) {
      s.events.forEach(function (e) {
        var row = el("div", "event");
        var d = new Date(e.starts_at);
        var date = el("div", "date");
        date.appendChild(el("div", "d display", String(d.getDate())));
        date.appendChild(el("div", "m", d.toLocaleDateString("sv-SE", { month: "short" }).replace(".", "")));
        row.appendChild(date);
        var body = el("div");
        body.appendChild(el("div", "kind", (KINDS[e.kind] || "Händelse") + " · " +
          (isToday(e.starts_at) ? "idag " : d.toLocaleDateString("sv-SE", { weekday: "long" }) + " ") +
          time(e.starts_at) + (e.ends_at ? "–" + time(e.ends_at) : "")));
        body.appendChild(el("div", "title", e.title));
        if (e.details) body.appendChild(el("p", null, e.details));
        var add = el("button", "cal", "+ Lägg till i kalendern");
        add.type = "button";
        add.addEventListener("click", function () { downloadIcs(s, [e], "maxvarv-" + e.title.replace(/[^\wåäöÅÄÖ-]+/g, "-") + ".ics"); });
        body.appendChild(add);
        row.appendChild(body);
        ev.appendChild(row);
      });
      if (s.events.length > 1) {
        var all = el("button", "btn cal-all", "Lägg till alla i kalendern");
        all.type = "button";
        all.style.background = "var(--ink)"; all.style.color = "#fff"; all.style.fontSize = "14px"; all.style.minHeight = "44px"; all.style.cursor = "pointer";
        all.addEventListener("click", function () { downloadIcs(s, s.events, "maxvarv-" + s.name.replace(/[^\wåäöÅÄÖ-]+/g, "-") + ".ics"); });
        ev.appendChild(all);
      }
    } else {
      ev.appendChild(el("p", "empty", "Inga inlagda träningar eller tävlingar just nu."));
    }
    left.appendChild(ev);

    // Club messages
    var msgs = (s.messages || []).filter(function (m) { return m.message; });
    if (msgs.length) {
      var mc = el("section", "card");
      mc.appendChild(el("h2", "display", "Senaste från klubben"));
      msgs.forEach(function (m) {
        var r = el("div", "msg");
        r.appendChild(el("div", "when", ago(m.created_at)));
        r.appendChild(el("p", null, m.message));
        mc.appendChild(r);
      });
      left.appendChild(mc);
    }

    // Fastest laps this season (riders who chose to show their times)
    if (courses.length) {
      var lc = el("section", "card");
      lc.appendChild(el("h2", "display", "Snabbaste varv " + new Date().getFullYear()));
      courses.forEach(function (c) {
        if (courses.length > 1 || c.name) lc.appendChild(el("h3", null, "🏁 " + (c.name || "")));
        if ((c.leaderboard || []).length) {
          var ol = el("ol", "lb");
          c.leaderboard.forEach(function (r, i) {
            var li = el("li");
            li.appendChild(el("span", "pos display", String(i + 1)));
            var who = el("span", "who", r.name);
            who.appendChild(el("small", null, (VEHICLES[r.vehicle] || "") + " · " + new Date(r.at).toLocaleDateString("sv-SE", { day: "numeric", month: "short" })));
            li.appendChild(who);
            li.appendChild(el("span", "t display", lap(r.seconds)));
            ol.appendChild(li);
          });
          lc.appendChild(ol);
        } else {
          lc.appendChild(el("p", "empty", "Inga varvtider än i år. Kör ett varv över start/mål med Maxvarv igång – tiden räknas automatiskt."));
        }
      });
      lc.appendChild(el("p", "empty", "Bara förare som valt att visa sina tider syns här.")).style.fontSize = "12px";
      right.appendChild(lc);
    }

    // Information
    var ic = el("section", "card");
    ic.appendChild(el("h2", "display", "Information"));
    var dl = el("dl", "info");
    function item(label, value, href) {
      if (!value) return;
      dl.appendChild(el("dt", null, label));
      var dd = el("dd");
      if (href) { var a = el("a", null, value); a.href = href; a.rel = "noopener"; dd.appendChild(a); }
      else dd.textContent = value;
      dl.appendChild(dd);
    }
    item("Öppettider", s.opening_hours);
    item("Priser", s.prices);
    item("Om banan", s.description);
    item("Klubb", s.club);
    if (s.website && /^https?:\/\//i.test(s.website)) item("Hemsida", s.website.replace(/^https?:\/\/(www\.)?/i, "").replace(/\/$/, ""), s.website);
    if (s.phone) item("Telefon", s.phone, "tel:" + s.phone.replace(/[^0-9+]/g, ""));
    if (s.email) item("E-post", s.email, "mailto:" + s.email);
    if (!dl.childNodes.length) dl.appendChild(el("p", "empty", "Klubben har inte lagt in öppettider eller priser än."));
    ic.appendChild(dl);
    right.appendChild(ic);

    grid.appendChild(left);
    grid.appendChild(right);
    main.appendChild(grid);

    // Follow in the app
    var f = el("section", "follow");
    var ft = el("div");
    ft.appendChild(el("h2", "display", "Följ " + s.name + " i Maxvarv"));
    ft.appendChild(el("p", null, "Få en notis när klubben sätter Öppet idag, lägger in en träning eller skriver till förarna. Spela in dina åk och få varvtider på banan. Gratis."));
    f.appendChild(ft);
    var fb = el("div");
    fb.appendChild(button("Ladda ner för iPhone", APP_STORE, "btn-gold"));
    fb.appendChild(el("p", "muted-small", "Android kommer snart."));
    f.appendChild(fb);
    main.appendChild(f);

    // For the club: printable poster with QR code
    var tools = el("p", "club-tools");
    tools.appendChild(document.createTextNode("Är du från klubben? "));
    var print = el("button", null, "Skriv ut en affisch med QR-kod till banan");
    print.type = "button";
    print.addEventListener("click", function () {
      print.textContent = "Förbereder…";
      loadScript("https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js").then(function () {
        buildPoster(s);
        print.textContent = "Skriv ut en affisch med QR-kod till banan";
        setTimeout(function () { window.print(); }, 300);
      }).catch(function () { print.textContent = "Kunde inte skapa QR-koden"; });
    });
    tools.appendChild(print);
    main.appendChild(tools);

    page.appendChild(main);

    // maxvarv.se/bana/?id=…&affisch=1 shows the poster directly (preview / PDF).
    if (new URLSearchParams(location.search).get("affisch") === "1") {
      loadScript("https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js").then(function () {
        buildPoster(s);
        document.body.classList.add("poster-mode");
      });
    }
  }).catch(function () {
    fail("Kunde inte hämta banan just nu. Försök igen om en stund.");
  });
})();
</script>
</body>
</html>
